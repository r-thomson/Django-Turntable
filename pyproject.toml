[project]
name = "django-turntable"
version = "0.2.0"
dependencies = [
    "django>=6.0.0",
]
requires-python = ">=3.13"
authors = [
    { name = "Ryan Thomson" },
]
description = "A lightweight Django library that helps you optimize your app's database access."
readme = "README.md"
license = "MIT"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: Django",
  "Intended Audience :: Developers",
  "Natural Language :: English",
]

[project.urls]
homepage = "https://github.com/r-thomson/Django-Turntable"
source = "https://github.com/r-thomson/Django-Turntable.git"
releasenotes = "https://github.com/r-thomson/Django-Turntable/releases"
issues = "https://github.com/r-thomson/Django-Turntable/issues"

[dependency-groups]
dev = [
    "debugpy==1.8.20",
    "django-stubs==5.2.9",
    "pyright==1.1.408",
    "ruff==0.15.0",
]

[build-system]
requires = ["uv_build>=0.9.18,<0.10.0"]
build-backend = "uv_build"

[tool.pyright]
include = ["src", "tests"]
strict = ["src"]

[tool.ruff.format]
line-ending = "lf"
quote-style = "single"

[tool.ruff.lint]
extend-select = ["B", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
